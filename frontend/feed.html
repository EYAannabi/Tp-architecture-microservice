<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Feed</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="max-w-2xl mx-auto mt-10">

<h1 class="text-3xl font-bold mb-4">Feed</h1>

<button onclick="logout()" class="bg-red-500 text-white px-3 py-1 mb-4 rounded">
Logout
</button>

<a href="profile.html" class="text-blue-500">Profile</a>

<div class="bg-white p-4 rounded shadow mt-4">

<textarea id="postContent" class="w-full border p-2 mb-2"></textarea>

<button onclick="createPost()" class="bg-blue-500 text-white px-4 py-2 rounded">
Post
</button>

</div>

<h2 class="text-xl mt-6">Stories</h2>

<div class="bg-white p-4 rounded shadow">

<input id="storyContent" class="border p-2 w-full mb-2">

<button onclick="createStory()" class="bg-purple-500 text-white px-3 py-1 rounded">
Add Story
</button>

<div id="stories"></div>

</div>

<div id="posts" class="mt-6"></div>

</div>

<script src="js/config.js"></script>
<script src="js/feed.js"></script>
<script src="js/stories.js"></script>

</body>
</html>
