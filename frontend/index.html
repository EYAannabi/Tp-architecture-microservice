<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Social</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex justify-center items-center h-screen">

<div class="bg-white p-8 rounded shadow w-96">

<h1 class="text-2xl font-bold mb-6 text-center">Mini Social</h1>

<input id="username" class="border p-2 w-full mb-2" placeholder="Username">

<input id="email" class="border p-2 w-full mb-2" placeholder="Email">

<input id="password" type="password" class="border p-2 w-full mb-4" placeholder="Password">

<div class="flex gap-2">

<button onclick="register()" class="bg-blue-500 text-white p-2 rounded w-full">
Register
</button>

<button onclick="login()" class="bg-green-500 text-white p-2 rounded w-full">
Login
</button>

</div>

<p id="msg" class="text-red-500 mt-4 text-center"></p>

</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
